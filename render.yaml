services:
  - type: web
    name: who-are-you
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: IMAGE_PROVIDER
        value: mock   # demo mode: no AI. Switch to gemini/replicate and add its key to enable real avatars
      - key: SIGNING_SECRET
        generateValue: true
      - key: GLOBAL_DAILY_CAP
        value: 500    # demo mode costs nothing; lower this again when real avatars are on
      - key: USER_DAILY_LIMIT
        value: 10
